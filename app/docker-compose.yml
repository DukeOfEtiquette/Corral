services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: corral
      POSTGRES_USER: corral
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corral -d corral"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./db
    working_dir: /app/db
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://corral:devpassword@postgres:5432/corral
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: ./db
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://corral:devpassword@postgres:5432/corral
    depends_on:
      postgres:
        condition: service_healthy

  test-roundtrip:
    build:
      context: ./db
      dockerfile: Dockerfile.test-roundtrip
    environment:
      DATABASE_URL: postgresql://corral:devpassword@postgres:5432/corral
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corral}
      POSTGRES_USER: ${POSTGRES_USER:-corral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corral} -d ${POSTGRES_DB:-corral}"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./db
      target: runtime
    working_dir: /app/db
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-corral}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-corral}}
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: ./db
      target: test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corral}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-corral}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  test-roundtrip:
    build:
      context: ./db
      target: test-roundtrip
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corral}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-corral}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./api
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-corral}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-corral}}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${API_HOST_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8123/healthz')\""]
      interval: 2s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api-test:
    build:
      context: ./api
      target: test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corral}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-corral}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
